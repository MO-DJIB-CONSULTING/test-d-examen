<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LIMO - Inscription</title>
<style>
  body, html {
    margin: 0; padding: 0; height: 100%;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  video {
    position: fixed; top:0; left:0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: -2;
  }

  /* Overlay */
  .overlay {
    position: absolute; top:0; left:0;
    width:100%; height:100%;
    display:flex; justify-content:center; align-items:center;
    background: rgba(0,0,0,0.4);
    flex-direction: column;
    color: #fff;
    text-align: center;
  }

  /* Texte incitatif */
  .invite-text {
    font-size: 20px;
    margin-bottom: 15px;
    color: #e0e0e0;
    text-shadow: 0 2px 5px rgba(0,0,0,0.6);
  }

  /* Bouton inscription */
  .btn {
    background: linear-gradient(135deg, #ff5a8c, #ff3f70);
    padding: 15px 35px;
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0px 0px 10px rgba(255,64,129,0.5);
    animation: pulse 2s infinite;
    transition: transform 0.2s ease, background 0.3s;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0px 0px 10px rgba(255,64,129,0.4); }
    50% { box-shadow: 0px 0px 20px rgba(255,64,129,0.6); }
  }

  .btn:hover { background: linear-gradient(135deg, #ff77a9, #ff5a8c); }
  .btn:active { transform: scale(0.92); }

  /* Formulaire */
  #formulaire {
    display: none;
    position: relative;
    width: 400px;
    background: rgba(0,0,0,0.85);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 0 15px rgba(0,191,165,0.4);
    text-align: left;
    flex-direction: column;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.5s ease, transform 0.5s ease;
    backdrop-filter: blur(8px);
  }

  input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
  }

  #submitBtn {
    background: #00bfa5;
    color: #fff;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.3s;
  }
  #submitBtn:hover { background: #26c6da; }

  #message {
    margin-top: 10px;
    font-size: 1em;
    text-align: center;
  }

  /* Section réseaux sociaux */
  .social-container {
    margin-top: 25px;
    text-align: center;
  }

  .social-title {
    font-size: 18px;
    margin-bottom: 10px;
    color: #fff;
    text-shadow: 0 2px 5px rgba(0,0,0,0.5);
  }

  .social-icons {
    display: flex;
    justify-content: center;
    gap: 15px;
  }

  .social-link img {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    transition: transform 0.3s, box-shadow 0.3s;
    box-shadow: 0px 0px 8px rgba(255,255,255,0.2);
  }

  .social-link img:hover {
    transform: scale(1.2);
    box-shadow: 0px 0px 15px rgba(255,64,129,0.8);
  }
</style>
</head>
<body>
<video autoplay muted loop playsinline>
  <source src="https://raw.githubusercontent.com/MO-DJIB-CONSULTING/test-d-examen/main/Black%20Neon%20Coming%20Soon%20Video%20(3).mp4" type="video/mp4">
</video>

<div class="overlay">
  <div class="invite-text"></div>
  <button id="inscrireBtn" class="btn">Inscrivez-vous</button>

  <form id="formulaire">
    <input type="text" id="nom" placeholder="Nom" required />
    <input type="text" id="prenom" placeholder="Prénom" required />
    <input type="email" id="email" placeholder="Email" required />
    <input type="tel" id="telephone" placeholder="Téléphone" required />
    <button id="submitBtn" type="submit">Envoyer</button>
    <div id="message"></div>
  </form>

  <!-- Section Suivez-nous -->
  <div class="social-container">
    <p class="social-title">Suivez-nous</p>
    <div class="social-icons">
      <a href="https://facebook.com" target="_blank" class="social-link"><img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook"></a>
      <a href="https://instagram.com" target="_blank" class="social-link"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="Instagram"></a>
      <a href="https://linkedin.com" target="_blank" class="social-link"><img src="https://cdn-icons-png.flaticon.com/512/145/145807.png" alt="LinkedIn"></a>
      <a href="https://twitter.com" target="_blank" class="social-link"><img src="https://cliply.co/wp-content/uploads/2019/07/371907030_TWITTER_ICON_400px.gif" alt="Twitter/X"></a>
    </div>
  </div>
</div>

<script>
  const inscrireBtn = document.getElementById("inscrireBtn");
  const formulaire = document.getElementById("formulaire");
  const message = document.getElementById("message");
  const emailInput = document.getElementById("email");

  const emailsUtilises = ["test@example.com", "contact@limo.com"];

  inscrireBtn.addEventListener("click", () => {
    inscrireBtn.style.display = "none";
    document.querySelector(".invite-text").style.display = "none";
    formulaire.style.display = "flex";
    setTimeout(() => {
      formulaire.style.opacity = "1";
      formulaire.style.transform = "scale(1)";
    }, 50);
  });

  emailInput.addEventListener("input", () => {
    if (emailsUtilises.includes(emailInput.value.trim().toLowerCase())) {
      message.style.color = "salmon";
      message.textContent = "❌ Cet email est déjà utilisé.";
    } else {
      message.textContent = "";
    }
  });

  formulaire.addEventListener("submit", function(e) {
    e.preventDefault();
    const email = emailInput.value.trim();

    if (emailsUtilises.includes(email.toLowerCase())) {
      message.style.color = "salmon";
      message.textContent = "❌ Cet email est déjà utilisé.";
      return;
    }

    const data = {
      nom: document.getElementById("nom").value,
      prenom: document.getElementById("prenom").value,
      email: email,
      telephone: document.getElementById("telephone").value
    };

    fetch("https://script.google.com/macros/s/AKfycbzEHt92xFTWGxoRbybdCgCrBTokdz4chfjKga1CZz7JsdJGerQc20oI_LuzirGaX_NECA/exec", {
      method: "POST",
      body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(response => {
      if (response.result === "success") {
        message.style.color = "lightgreen";
        message.textContent = "✅ Inscription réussie ! Merci.";
        formulaire.reset();
      } else {
        message.style.color = "salmon";
        message.textContent = "❌ Erreur, réessayez.";
      }
    })
    .catch(() => {
      message.style.color = "salmon";
      message.textContent = "❌ Impossible de contacter le serveur.";
    });
  });
</script>
</body>
</html>
